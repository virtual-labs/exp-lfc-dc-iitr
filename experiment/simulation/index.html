<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Load Frequency Control</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.0.1/dist/chart.umd.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    /* Hide all screens initially except the visible one */
    .initial-screen,
    .single-area-container,
    .two-area-container {
      display: none;
    }
    .visible {
      display: block;
    }
    .title {
      text-align: center;
      width: 100%;
    }
    /* Row and Column Layout */
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .column {
      flex: 1;
      min-width: 300px;
    }
    /* Make inner containers use full column width */
    .input-container,
    .image-container,
    .plots-container {
      width: 100%;
    }
    .input-row {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 5px;
    }
    .input-row label {
      font-weight: bold;
      width: 55%;
      text-align: right;
      padding-right: 10px;
    }
    .input-row input {
      width: 15%;
      padding: 5px;
      text-align: center;
    }
    .button-container {
      text-align: center;
      margin-top: 20px;
    }
    button {
      padding: 12px 25px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .image-container {
      text-align: center;
    }
    .image-container img {
      max-width: 100%;
    }
    .plots-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      width: 100% !important;
      max-width: 600px;
      height: 320px !important;
      margin-bottom: 20px;
    }
    label {
      margin-right: 10px;
      margin-bottom: 5px;
    }
    input {
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <!-- Initial Screen -->
  <div class="initial-screen visible">
    <h1>Load Frequency Control</h1>
    <button onclick="showSingleArea()">Single Area Load Frequency Control</button>
    <button onclick="showTwoArea()">Two Area Load Frequency Control</button>
  </div>

  <!-- Single Area Container -->
  <div class="single-area-container">
    <h1 class="title">Single Area Load Frequency Control</h1>
    <div class="row">
      <!-- First Column: Input Container -->
      <div class="column">
        <div class="input-container">
          <div class="input-row">
            <label for="Tg">Governor Time Constant (T<sub>G</sub>):</label>
            <input type="number" id="Tg" value="0.2" step="0.01" />
          </div>
          <div class="input-row">
            <label for="Tt">Turbine Time Constant (T<sub>T</sub>):</label>
            <input type="number" id="Tt" value="0.5" step="0.01" />
          </div>
          <div class="input-row">
            <label for="R">Droop Value (R):</label>
            <input type="number" id="R" value="0.03333" step="0.00001" />
          </div>
          <div class="input-row">
            <label for="D">Damping Constant (D):</label>
            <input type="number" id="D" value="0.80" step="0.01" />
          </div>
          <div class="input-row">
            <label for="M">Rotational Inertia (M):</label>
            <input type="number" id="M" value="10" step="0.1" />
          </div>
          <div class="input-row">
            <label for="delPc_var">Change in Mechanical Power (ΔP<sub>C</sub>):</label>
            <input type="number" id="delPc_var" value="0" step="0.01" />
          </div>
          <div class="input-row">
            <label for="delPl_var">Change in Load Power (ΔP<sub>L</sub>):</label>
            <input type="number" id="delPl_var" value="1" step="0.01" />
          </div>
          <div class="input-row">
            <label for="tf">Total Simulation Time:</label>
            <input type="number" id="tf" value="20" step="1" />
          </div>
          <div class="input-row">
            <label for="tc">Change of Power at Time:</label>
            <input type="number" id="tc" value="2" step="0.1" />
          </div>
          <div class="input-row">
            <label for="h">Time Step:</label>
            <input type="number" id="h" value="0.01" step="0.0001" />
          </div>
          <div class="button-container">
            <button onclick="generatePlots()">Plot</button>
          </div>
        </div>
      </div>
      <!-- Second Column: Image and Plots -->
      <div class="column">
        <div class="image-container">
          <img src="images/LFCsinglecolor.png" alt="Diagram" />
        </div>
        <div class="plots-container">
          <canvas id="delWChart"></canvas>
          <canvas id="delPgChart"></canvas>
          <canvas id="delPmChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Two Area Container -->
  <div class="two-area-container">
    <h1 class="title">Two Area Load Frequency Control</h1>
    <div class="row">
      <!-- First Column: Input Container -->
      <div class="column">
        <div class="input-container">
          <div class="input-row">
            <label for="Tg1">Time constant of Governor Area 1 (T<sub>G1</sub>) in sec:</label>
            <input type="number" id="Tg1" value="0.2" step="0.01" />
          </div>
          <div class="input-row">
            <label for="Tt1">Time constant of Turbine Area 1 (T<sub>T1</sub>) in sec:</label>
            <input type="number" id="Tt1" value="0.5" step="0.01" />
          </div>
          <div class="input-row">
            <label for="R1">Droop value Area 1 (R<sub>1</sub>):</label>
            <input type="number" id="R1" value="0.03333" step="0.00001" />
          </div>
          <div class="input-row">
            <label for="D1">Damping Constant Area 1 (D<sub>1</sub>):</label>
            <input type="number" id="D1" value="0.80" step="0.01" />
          </div>
          <div class="input-row">
            <label for="M1">Rotational Inertia Area 1 (M<sub>1</sub>):</label>
            <input type="number" id="M1" value="10" step="0.1" />
          </div>
          <div class="input-row">
            <label for="delPc1_var">Change in Mechanical Power 1 (ΔP<sub>C1</sub>):</label>
            <input type="number" id="delPc1_var" value="0" step="0.01" />
          </div>
          <div class="input-row">
            <label for="delPl1_var">Change in Load Power 1 (ΔP<sub>L1</sub>):</label>
            <input type="number" id="delPl1_var" value="1" step="0.01" />
          </div>
          <div class="input-row">
            <label for="Tg2">Time constant of Governor Area 2 (T<sub>G2</sub>) in sec:</label>
            <input type="number" id="Tg2" value="0.2" step="0.01" />
          </div>
          <div class="input-row">
            <label for="Tt2">Time constant of Turbine Area 2 (T<sub>T2</sub>) in sec:</label>
            <input type="number" id="Tt2" value="0.5" step="0.01" />
          </div>
          <div class="input-row">
            <label for="R2">Droop value Area 2 (R<sub>2</sub>):</label>
            <input type="number" id="R2" value="0.03333" step="0.00001" />
          </div>
          <div class="input-row">
            <label for="D2">Damping Constant Area 2 (D<sub>2</sub>):</label>
            <input type="number" id="D2" value="0.80" step="0.01" />
          </div>
          <div class="input-row">
            <label for="M2">Rotational Inertia Area 2 (M<sub>2</sub>):</label>
            <input type="number" id="M2" value="10" step="0.1" />
          </div>
          <div class="input-row">
            <label for="delPc2_var">Change in Mechanical Power 2 (ΔP<sub>C2</sub>):</label>
            <input type="number" id="delPc2_var" value="0" step="0.01" />
          </div>
          <div class="input-row">
            <label for="delPl2_var">Change in Load Power 2 (ΔP<sub>L2</sub>):</label>
            <input type="number" id="delPl2_var" value="0" step="0.01" />
          </div>
          <div class="input-row">
            <label for="tf2">Total Simulation Time:</label>
            <input type="number" id="tf2" value="100" step="1" />
          </div>
          <div class="input-row">
            <label for="tc2">Change of Power at Time:</label>
            <input type="number" id="tc2" value="2" step="0.1" />
          </div>
          <div class="input-row">
            <label for="h2">Time Step:</label>
            <input type="number" id="h2" value="0.01" step="0.0001" />
          </div>
          <div class="button-container">
            <button onclick="generateTwoAreaPlots()">Plot</button>
          </div>
        </div>
      </div>
      <!-- Second Column: Image and Plots -->
      <div class="column">
        <div class="image-container">
          <img src="images/LFCtwocolor.png" alt="Diagram" />
        </div>
        <div class="plots-container">
          <canvas id="delW1Chart"></canvas>
          <canvas id="delW2Chart"></canvas>
          <canvas id="tieLineChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Global object to hold chart instances
    const chartInstances = {};

    // Global plotData function to create/destroy charts as needed
    function plotData(canvasId, time, data, title, ylabel) {
      const ctx = document.getElementById(canvasId).getContext("2d");
      if (chartInstances[canvasId]) {
        chartInstances[canvasId].destroy();
      }
      chartInstances[canvasId] = new Chart(ctx, {
        type: "line",
        data: {
          labels: time,
          datasets: [{
            label: ylabel,
            data: data,
            borderColor: "blue",
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            title: { display: true, text: title }
          },
          scales: {
            x: {
              title: { display: true, text: "Time (s)" }
            },
            y: {
              title: { display: true, text: ylabel }
            }
          }
        }
      });
    }

    // Show/hide containers based on selection
    function showSingleArea() {
      document.querySelector(".initial-screen").classList.remove("visible");
      document.querySelector(".single-area-container").classList.add("visible");
    }

    function showTwoArea() {
      document.querySelector(".initial-screen").classList.remove("visible");
      document.querySelector(".two-area-container").classList.add("visible");
    }

    // Single Area Simulation and Plotting
    function generatePlots() {
      // Get input values
      const Tg = parseFloat(document.getElementById("Tg").value);
      const Tt = parseFloat(document.getElementById("Tt").value);
      const R = parseFloat(document.getElementById("R").value);
      const D = parseFloat(document.getElementById("D").value);
      const M = parseFloat(document.getElementById("M").value);

      const delPc_initial = 0;
      const delPl_initial = 0;
      const delPc_var = parseFloat(document.getElementById("delPc_var").value);
      const delPl_var = parseFloat(document.getElementById("delPl_var").value);

      const t0 = 0;
      const tf = parseFloat(document.getElementById("tf").value);
      const h = parseFloat(document.getElementById("h").value);
      const n = Math.ceil((tf - t0) / h);
      const tc = parseFloat(document.getElementById("tc").value);

      const time = Array.from({ length: n }, (_, i) => t0 + i * h);
      const state = Array(n).fill(null).map(() => [0, 0, 0]);

      function f(t, state, delPl, delPc) {
        const [delPg, delPm, delW] = state;
        return [
          (delPc - delW / R - delPg) / Tg,
          (delPg - delPm) / Tt,
          (delPm - delPl - D * delW) / M
        ];
      }

      for (let i = 0; i < n - 1; i++) {
        const t = time[i];
        const s = state[i];
        const delPl = t >= tc ? delPl_var : delPl_initial;
        const delPc = t >= tc ? delPc_var : delPc_initial;

        const k1 = f(t, s, delPl, delPc);
        const s_temp = s.map((val, idx) => val + h * k1[idx]);
        const k2 = f(t + h, s_temp, delPl, delPc);
        state[i + 1] = s.map((val, idx) => val + 0.5 * h * (k1[idx] + k2[idx]));
      }

      const delPg = state.map(s => s[0]);
      const delPm = state.map(s => s[1]);
      const delW = state.map(s => s[2]);

      plotData("delWChart", time, delW, "Δω vs Time", "Δω");
      plotData("delPmChart", time, delPm, "ΔPM vs Time", "ΔPM");
      plotData("delPgChart", time, delPg, "ΔPG vs Time", "ΔPG");
    }

    // Two Area Simulation and Plotting
    function generateTwoAreaPlots() {
      // Get inputs for Area 1
      const Tg1 = parseFloat(document.getElementById("Tg1").value);
      const Tt1 = parseFloat(document.getElementById("Tt1").value);
      const R1 = parseFloat(document.getElementById("R1").value);
      const D1 = parseFloat(document.getElementById("D1").value);
      const M1 = parseFloat(document.getElementById("M1").value);

      // Get inputs for Area 2
      const Tg2 = parseFloat(document.getElementById("Tg2").value);
      const Tt2 = parseFloat(document.getElementById("Tt2").value);
      const R2 = parseFloat(document.getElementById("R2").value);
      const D2 = parseFloat(document.getElementById("D2").value);
      const M2 = parseFloat(document.getElementById("M2").value);

      // Power change values
      const delPc1_initial = 0;
      const delPl1_initial = 0;
      const delPc1_var = parseFloat(document.getElementById("delPc1_var").value);
      const delPl1_var = parseFloat(document.getElementById("delPl1_var").value);

      const delPc2_initial = 0;
      const delPl2_initial = 0;
      const delPc2_var = parseFloat(document.getElementById("delPc2_var").value);
      const delPl2_var = parseFloat(document.getElementById("delPl2_var").value);

      const t02 = 0;
      const tf2 = parseFloat(document.getElementById("tf2").value);
      const tc2 = parseFloat(document.getElementById("tc2").value);

      const h2 = parseFloat(document.getElementById("h2").value);
      const Tie = 1;

      const n = Math.ceil((tf2 - t02) / h2);
      const time2 = Array.from({ length: n }, (_, i) => t02 + i * h2);
      const state2 = Array(n).fill(null).map(() => [0, 0, 0, 0, 0, 0, 0, 0]);

      function f(t, state2, delPl1, delPc1, delPl2, delPc2) {
        const [delPg1, delPm1, delW1, theta1, delPg2, delPm2, delW2, theta2] = state2;
        return [
          (delPc1 - delW1 / R1 - delPg1) / Tg1,
          (delPg1 - delPm1) / Tt1,
          (delPm1 - delPl1 - D1 * delW1 - Tie * (theta1 - theta2)) / M1,
          delW1,
          (delPc2 - delW2 / R2 - delPg2) / Tg2,
          (delPg2 - delPm2) / Tt2,
          (delPm2 - delPl2 - D2 * delW2 + Tie * (theta1 - theta2)) / M2,
          delW2
        ];
      }

      for (let i = 0; i < n - 1; i++) {
        const t2 = time2[i];
        const s2 = state2[i];
        const delPl1 = t2 >= tc2 ? delPl1_var : delPl1_initial;
        const delPc1 = t2 >= tc2 ? delPc1_var : delPc1_initial;
        const delPl2 = t2 >= tc2 ? delPl2_var : delPl2_initial;
        const delPc2 = t2 >= tc2 ? delPc2_var : delPc2_initial;

        const k1 = f(t2, s2, delPl1, delPc1, delPl2, delPc2);
        const s_temp2 = s2.map((val2, idx2) => val2 + h2 * k1[idx2]);
        const k2 = f(t2 + h2, s_temp2, delPl1, delPc1, delPl2, delPc2);
        state2[i + 1] = s2.map((val2, idx2) => val2 + 0.5 * h2 * (k1[idx2] + k2[idx2]));
      }

      const delW1 = state2.map(s2 => s2[2]);
      const delW2 = state2.map(s2 => s2[6]);
      const delP12 = state2.map(s2 => Tie * (s2[3] - s2[7]));

      plotData("delW1Chart", time2, delW1, "Δω1 vs Time", "Δω1");
      plotData("delW2Chart", time2, delW2, "Δω2 vs Time", "Δω2");
      plotData("tieLineChart", time2, delP12, "Tie Line Power vs Time", "ΔP12");
    }
  </script>
</body>
</html>
